<style>@font-face{font-family:NR;src:url(data:font/woff2;base64,) format('woff2');font-weight:200 800}@font-face{font-family:IS;src:url(data:font/woff2;base64,) format('woff2');font-weight:400 700}@font-face{font-family:PM;src:url(data:font/woff2;base64,) format('woff2');font-weight:400}</style>
